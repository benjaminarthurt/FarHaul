name: Deploy web build

# Publishes the prebuilt web export in site/ to GitHub Pages on every push to main.
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
# To update the game online: re-export to site/ (see README) and push.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
